name: Build Kernel Redmi 12C (earth) - Merge CIP 4.19

on:
  workflow_dispatch:
    inputs:
      cip_tag:
        description: "Tag CIP (mis. v4.19.325-cip136)"
        required: true
        default: "v4.19.325-cip136"
      build:
        description: "Build test setelah merge?"
        required: true
        default: true
        type: boolean
      push_branch:
        description: "Push hasil merge ke branch baru di repo ini?"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-kernel-earth
  cancel-in-progress: true

jobs:
  merge-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout kernel LineageOS (ke subfolder kernel/)
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_xiaomi_earth
          ref: lineage-23.2
          fetch-depth: 0
          path: kernel

      - name: Setup git
        working-directory: kernel
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config commit.gpgsign false
          git log --oneline -1
          cat localversion-cip localversion-st

      - name: Fetch CIP
        working-directory: kernel
        env:
          CIP_TAG: ${{ inputs.cip_tag }}
        run: |
          git remote add cip https://gitlab.com/cip-project/cip-kernel/linux-cip.git || true
          git fetch cip "refs/tags/${CIP_TAG}:refs/tags/${CIP_TAG}"
          git log --oneline -1 "${CIP_TAG}"

      - name: Merge CIP
        working-directory: kernel
        env:
          CIP_TAG: ${{ inputs.cip_tag }}
        run: |
          set +e
          git merge --no-commit --no-ff "${CIP_TAG}"
          set -e

          echo "=== File konflik setelah merge ==="
          git diff --name-only --diff-filter=U > conflicts.txt || true
          cat conflicts.txt || true

          CIP_NUM=$(echo "${CIP_TAG}" | sed -E 's/.*-cip([0-9]+).*/\1/')
          ST_NUM=$((CIP_NUM - 116))   # cip124=st8, cip136=st20
          echo "CIP_NUM=${CIP_NUM}" >> "$GITHUB_ENV"
          echo "ST_NUM=${ST_NUM}"   >> "$GITHUB_ENV"

          # Bump versi (file ini dikelola manual di tree Android)
          printf -- "-cip%s\n" "${CIP_NUM}" > localversion-cip
          printf -- "-st%s\n"  "${ST_NUM}"  > localversion-st
          git add localversion-cip localversion-st

          # Cek ulang: konflik di luar localversion-* berarti gagal
          git diff --name-only --diff-filter=U > conflicts.txt || true
          if [ -s conflicts.txt ]; then
            echo "::error::Merge berhenti: konflik di luar localversion-*. Lihat artifact conflicts.txt"
            cat conflicts.txt
            exit 1
          fi

          rm -f conflicts.txt
          git commit -m "Merge CIP ${CIP_TAG} into lineage-23.2 (earth)"
          git log --oneline -3
          cat localversion-cip localversion-st

      - name: Install build deps
        if: inputs.build
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu clang lld flex bison bc \
            libssl-dev libelf-dev cpio rsync python3
          df -h

      - name: Build test (earth_defconfig, GCC aarch64)
        if: inputs.build
        working-directory: kernel
        run: |
          set -e
          make -j"$(nproc)" O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- earth_defconfig
          make -j"$(nproc)" O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- Image.gz dtbs
          ls -lh out/arch/arm64/boot/Image.gz
          cp out/.config kernel-config.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cip-merge-result-run-${{ github.run_number }}
          path: |
            kernel/conflicts.txt
            kernel/kernel-config.txt
            kernel/out/arch/arm64/boot/Image.gz
          if-no-files-found: warn

      - name: Push merge branch (opsional, ke repo ini)
        if: inputs.push_branch
        working-directory: kernel
        env:
          GH_TOKEN: ${{ github.token }}
          CIP_NUM: ${{ env.CIP_NUM }}
        run: |
          git remote add fork "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" || true
          BRANCH="cip${CIP_NUM}-merge"
          git checkout -b "${BRANCH}"
          git push fork "${BRANCH}" --force-with-lease
          echo "Pushed branch: ${BRANCH} ke ${{ github.repository }}"
