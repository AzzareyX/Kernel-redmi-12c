name: Build Kernel Redmi 12C (Earth)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Membersihkan Ruang Penyimpanan Virtual Server
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
        sudo apt-get clean

    - name: Instalasi Kompiler Resmi & Dependensi Linux
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev xz-utils git make ccache clang lld llvm crossbuild-essential-arm64 crossbuild-essential-armhf libssl-dev tzdata libkmod-dev libelf-dev wget curl

    - name: Unduh Source Code Kernel (LineageOS Earth)
      run: |
        BASE_URL="https://github.com"
        REPO_PATH="/LineageOS/android_kernel_xiaomi_earth.git"
        git clone "${BASE_URL}${REPO_PATH}" --depth=1 -b lineage-23.2 kernel

    - name: Unduh Toolchain Kompiler via Arsip Resmi (AOSP Clang Tarball)
      run: |
        # Mengunduh arsip kompresi resmi dari Google Source menggunakan wget agar stabil
        BASE_URL="https://android.googlesource.com"
        REPO_PATH="/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2022/clang-r450784d.tar.gz"
        
        mkdir -p toolchain
        wget -q "${BASE_URL}${REPO_PATH}" -O clang.tar.gz
        tar -xzf clang.tar.gz -C toolchain/
        rm -f clang.tar.gz
        echo "Toolchain Clang r450784d berhasil terpasang!"

    - name: Penambalan Otomatis Bug Driver (Hotfix Patch)
      run: |
        cd kernel
        # Mengatasi eror keyslot manager enkripsi penyimpanan MediaTek 4.19
        sed -i 's/inline void ksm_flock/static inline void ksm_flock/g' include/linux/keyslot-manager.h
        echo "Tambalan hotfix berhasil diterapkan!"

    - name: Proses Kompilasi Kernel
      run: |
        cd kernel
        
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Memasukkan folder toolchain independen ke dalam System PATH
        export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
        
        # Pengaturan bendera Cross-Compile menggunakan ekosistem AOSP Clang Penuh (LLVM)
        export CC=clang
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip
        
        # Menggunakan LLVM bawaan toolchain AOSP untuk tugas cross-compile target
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        # Bendera pelindung dari warning standar compiler ketat
        export KCFLAGS="-Wno-error -Wno-strict-prototypes"
        export KCPPFLAGS="-Wno-error"

        # 1. Regenerasi berkas cetak biru Redmi 12C (earth)
        make O=out earth_defconfig
        
        # 2. Mulai kompilasi utama secara otomatis
        make -j$(nproc --all) O=out KCFLAGS="-Wno-error -Wno-strict-prototypes" KCPPFLAGS="-Wno-error"

    - name: Unggah Berkas Kernel Matang (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Redmi12C-Earth-LineageOS23.2
        path: |
          kernel/out/arch/arm64/boot/Image.gz-dtb
          kernel/out/arch/arm64/boot/Image
          kernel/out/arch/arm64/boot/dtbo.img
