name: Build Kernel Redmi 12C (Earth)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Membersihkan Ruang Penyimpanan Virtual Server
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
        sudo apt-get clean

    - name: Instalasi Kompiler & Dependensi Linux
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev xz-utils git make ccache clang lld llvm crossbuild-essential-arm64 crossbuild-essential-armhf libssl-dev tzdata libkmod-dev libelf-dev

    - name: Unduh Source Code Kernel (LineageOS Earth)
      run: |
        BASE_URL="https://github.com"
        REPO_PATH="/LineageOS/android_kernel_xiaomi_earth.git"
        git clone "${BASE_URL}${REPO_PATH}" --depth=1 -b lineage-23.2 kernel

    - name: Unduh Toolchain Kompiler Resmi (AOSP Clang Publik)
      run: |
        # Menggunakan repositori AOSP Clang publik di GitHub agar tidak meminta username/password
        BASE_URL="https://github.com"
        REPO_PATH="/LineageOS/android_prebuilts_clang_host_linux-x86.git"
        git clone "${BASE_URL}${REPO_PATH}" --depth=1 -b master toolchain

    - name: Unduh Toolchain Pendamping (Eva GCC arm64 & arm32)
      run: |
        BASE_URL="https://github.com"
        git clone "${BASE_URL}/mvaisakh/gcc-arm64.git" --depth=1 gcc64
        git clone "${BASE_URL}/mvaisakh/gcc-arm.git" --depth=1 gcc32

    - name: Proses Kompilasi Kernel
      run: |
        cd kernel
        
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Mencari folder versi clang otomatis di dalam toolchain resmi LineageOS
        CLANG_VERSION=$(ls $GITHUB_WORKSPACE/toolchain/ | grep -E '^clang-r[0-9]+' | head -n 1)
        
        # Memasukkan semua jalur biner compiler ke dalam System PATH environment
        export PATH="$GITHUB_WORKSPACE/toolchain/$CLANG_VERSION/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"
        
        # Pengaturan bendera Compiler Silang (Cross-Compile Flags)
        export CC=clang
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip
        
        # Mengarahkan pengerjaan perakitan biner ke GCC pendamping khusus MTK
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        
        # Menjinakkan peringatan ketat agar tidak memicu pemutusan paksa (Force Stop)
        export KCFLAGS="-Wno-error"
        export KCPPFLAGS="-Wno-error"

        # 1. Regenerasi berkas cetak biru Redmi 12C (earth)
        make O=out earth_defconfig
        
        # 2. Eksekusi pembangunan kernel secara multi-thread
        make -j$(nproc --all) O=out KCFLAGS="-Wno-error" KCPPFLAGS="-Wno-error"

    - name: Unggah Berkas Kernel Matang (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Redmi12C-Earth-LineageOS23.2
        path: |
          kernel/out/arch/arm64/boot/Image.gz-dtb
          kernel/out/arch/arm64/boot/Image
          kernel/out/arch/arm64/boot/dtbo.img
