name: Merge Linux CIP 4.19 (diagnose, no fork)

# Jalankan di repo kecil milikmu (bukan fork kernel).
# Fokus: merge CIP lalu bila gagal/konflik, simpan log + diff + potongan
# conflict marker per file sebagai artifact, dan tandai job FAILED.

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Branch kernel LineageOS"
        required: true
        default: lineage-23.2
      cip_tag:
        description: "Tag CIP. Kosongkan = otomatis v4.19.*-cip* terbaru"
        required: false
        default: ""
      push_branch:
        description: "Nama branch hasil merge"
        required: true
        default: merge/linux-cip-4.19
      merge_mode:
        description: "report = berhenti & laporkan konflik (disarankan). theirs = paksa pakai versi CIP"
        type: choice
        options:
          - report
          - theirs
        default: report
      target_repo:
        description: "owner/repo tujuan push. Kosong = repo workflow ini"
        required: false
        default: ""
      push:
        description: "Push branch hanya kalau merge bersih"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: merge-cip-diagnose
  cancel-in-progress: false

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_xiaomi_earth.git
  CIP_REPO: https://git.kernel.org/pub/scm/linux/kernel/git/cip/linux-cip.git

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Pilih tag CIP 4.19 terbaru
        id: cip
        env:
          CIP_TAG_INPUT: ${{ inputs.cip_tag }}
        run: |
          set -euo pipefail
          if [ -z "$CIP_TAG_INPUT" ]; then
            TAG=$(git ls-remote --tags --refs "$CIP_REPO" 'v4.19.*-cip*' \
              | awk '{print $2}' | sed 's#refs/tags/##' \
              | grep -E '^v4\.19\.[0-9]+-cip[0-9]+$' \
              | sort -V | tail -1)
          else
            TAG="$CIP_TAG_INPUT"
          fi
          test -n "${TAG:-}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "CIP tag: $TAG"

      - name: Clone kernel upstream (tanpa fork)
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          set -euo pipefail
          git clone --single-branch --branch "$BASE_BRANCH" "$KERNEL_REPO" kernel
          cd kernel
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Base commit: $(git log --oneline -1)"

      - name: Fetch tag CIP
        env:
          TAG: ${{ steps.cip.outputs.tag }}
        run: |
          set -euo pipefail
          cd kernel
          git fetch --no-tags "$CIP_REPO" "+refs/tags/$TAG:refs/tags/$TAG"

      - name: Merge + rekam konflik
        id: merge
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          PUSH_BRANCH: ${{ inputs.push_branch }}
          MERGE_MODE: ${{ inputs.merge_mode }}
          TAG: ${{ steps.cip.outputs.tag }}
        run: |
          set -euo pipefail
          cd kernel
          REPORT="$GITHUB_WORKSPACE/report"
          mkdir -p "$REPORT/conflicts"
          : > "$REPORT/conflict-files.txt"

          if [ "$PUSH_BRANCH" = "$BASE_BRANCH" ]; then
            echo "::error::push_branch tidak boleh sama dengan base_branch"
            exit 1
          fi

          git switch -C "$PUSH_BRANCH"
          git rev-parse HEAD > "$REPORT/base-commit.txt"
          git rev-parse "refs/tags/$TAG" > "$REPORT/cip-commit.txt"
          git merge-base HEAD "refs/tags/$TAG" > "$REPORT/merge-base.txt" 2>/dev/null || true
          git log --oneline --left-right --graph "HEAD...refs/tags/$TAG" \
            > "$REPORT/divergence.txt" 2>/dev/null || true

          ARGS=(--no-ff --no-edit -m "Merge Linux CIP $TAG into $BASE_BRANCH")
          if [ "$MERGE_MODE" = "theirs" ]; then
            ARGS+=(-X theirs)
          fi

          set +e
          git merge "${ARGS[@]}" "refs/tags/$TAG" > "$REPORT/merge.log" 2>&1
          RC=$?
          set -e
          cat "$REPORT/merge.log"

          if [ "$RC" -eq 0 ]; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
            git log --oneline -1 > "$REPORT/result.txt"
            git diff --stat HEAD^1 HEAD > "$REPORT/diff-stat.txt" 2>/dev/null || true
            {
              echo "## Merge CIP bersih"
              echo ""
              echo "- CIP tag: \`$TAG\`"
              echo "- Base: \`$BASE_BRANCH\`"
              echo "- Merge commit: \`$(git rev-parse --short HEAD)\`"
              echo ""
              echo '```'
              git diff --stat HEAD^1 HEAD | tail -20 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # --- Merge gagal / konflik: kumpulkan bukti selengkap mungkin ---
          echo "clean=false" >> "$GITHUB_OUTPUT"
          git status --short > "$REPORT/git-status.txt" 2>/dev/null || true
          git ls-files -u > "$REPORT/unmerged-stages.txt" 2>/dev/null || true
          git diff --name-only --diff-filter=U | sort -u > "$REPORT/conflict-files.txt" || true
          git diff --cc > "$REPORT/conflicts-all.diff" 2>/dev/null || true

          while IFS= read -r f; do
            [ -n "$f" ] || continue
            safe=$(printf '%s' "$f" | tr '/ ' '__')
            git diff --cc -- "$f" > "$REPORT/conflicts/$safe.diff" 2>/dev/null || true
            if [ ! -s "$REPORT/conflicts/$safe.diff" ]; then
              git diff -- "$f" > "$REPORT/conflicts/$safe.diff" 2>/dev/null || true
            fi
            # potongan asli conflict marker (bagian yang bentrok)
            awk '/^<<<<<<< /{p=1} p{print} /^>>>>>>> /{p=0; print "---"}' "$f" \
              > "$REPORT/conflicts/$safe.markers.txt" 2>/dev/null || true
          done < "$REPORT/conflict-files.txt"

          COUNT=$(wc -l < "$REPORT/conflict-files.txt" | tr -d ' ')
          HUNKS=$(grep -rh --include='*.markers.txt' '^<<<<<<< ' "$REPORT/conflicts" 2>/dev/null | wc -l | tr -d ' ') || HUNKS=0

          {
            echo "## Merge CIP: KONFLIK / GAGAL"
            echo ""
            echo "| Item | Nilai |"
            echo "|---|---|"
            echo "| CIP tag | \`$TAG\` |"
            echo "| Base | \`$BASE_BRANCH\` |"
            echo "| File konflik | **$COUNT** |"
            echo "| Conflict hunk | **$HUNKS** |"
            echo ""
            echo "### File konflik"
            echo '```'
            if [ "$COUNT" -gt 0 ]; then
              head -100 "$REPORT/conflict-files.txt"
            else
              echo "(tidak ada unmerged file - lihat merge.log, kemungkinan gagal karena sebab lain)"
            fi
            echo '```'
            if [ "$COUNT" -gt 100 ]; then
              echo "_...dan $((COUNT - 100)) file lainnya, lihat artifact._"
            fi
            if [ "$COUNT" -gt 0 ]; then
              echo ""
              echo "### Sebaran per direktori"
              echo '```'
              awk -F/ '{print $1"/"$2}' "$REPORT/conflict-files.txt" \
                | sort | uniq -c | sort -rn | head -15
              echo '```'
            fi
            echo ""
            echo "### Tail merge.log"
            echo '```'
            tail -30 "$REPORT/merge.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # tampilkan maksimal 10 annotation biar kelihatan di UI
          N=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            [ "$N" -lt 10 ] || break
            echo "::error file=$f,line=1,title=Merge conflict::Konflik merge CIP $TAG"
            N=$((N + 1))
          done < "$REPORT/conflict-files.txt"

          git merge --abort || true
          echo "::error::Merge gagal. Download artifact 'cip-merge-report' untuk daftar file, diff, dan conflict marker."
          exit 1

      - name: Push kalau merge bersih
        if: ${{ inputs.push && steps.merge.outputs.clean == 'true' }}
        env:
          PUSH_BRANCH: ${{ inputs.push_branch }}
          TARGET_REPO_INPUT: ${{ inputs.target_repo }}
          TOKEN: ${{ secrets.PAT || github.token }}
        run: |
          set -euo pipefail
          cd kernel
          TARGET_REPO="${TARGET_REPO_INPUT:-$GITHUB_REPOSITORY}"
          git remote add target "https://x-access-token:${TOKEN}@github.com/${TARGET_REPO}.git"
          git push --force target "HEAD:refs/heads/$PUSH_BRANCH"
          echo "Pushed: https://github.com/${TARGET_REPO}/tree/${PUSH_BRANCH}"

      - name: Tarball source kalau merge bersih
        if: always() && steps.merge.outputs.clean == 'true'
        env:
          TAG: ${{ steps.cip.outputs.tag }}
        run: |
          set -euo pipefail
          cd kernel
          git archive --format=tar.gz \
            --prefix="android_kernel_xiaomi_earth-${TAG}/" \
            -o "$GITHUB_WORKSPACE/report/kernel-${TAG}.tar.gz" HEAD

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cip-merge-report
          path: report
          if-no-files-found: ignore
          retention-days: 30
