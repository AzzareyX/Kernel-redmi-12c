name: Build Kernel Redmi 12C (Earth)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Membersihkan Ruang Penyimpanan Virtual Server
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
        sudo apt-get clean

    - name: Instalasi Kompiler Resmi & Dependensi Linux
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev xz-utils git make ccache clang lld llvm crossbuild-essential-arm64 crossbuild-essential-armhf libssl-dev tzdata libkmod-dev libelf-dev

    - name: Unduh Source Code Kernel (LineageOS Earth)
      run: |
        BASE_URL="https://github.com"
        REPO_PATH="/LineageOS/android_kernel_xiaomi_earth.git"
        git clone "${BASE_URL}${REPO_PATH}" --depth=1 -b lineage-23.2 kernel

    - name: Penambalan Otomatis Bug Driver (Hotfix Patch)
      run: |
        cd kernel
        # Perbaikan enkripsi blok
        sed -i 's/inline void ksm_flock/static inline void ksm_flock/g' include/linux/keyslot-manager.h
        
        # Perbaikan standarisasi inline eksternal pada beberapa driver MediaTek lawas
        find . -name "*.h" -type f exec sed -i 's/extern inline/static inline/g' {} + 2>/dev/null || true
        echo "Semua tambalan hotfix berhasil diterapkan!"

    - name: Proses Kompilasi Kernel
      run: |
        cd kernel
        
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Menggunakan kompiler Clang internal host
        export CC=clang
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip
        
        # Jalur cross-compiler bawaan sistem Ubuntu
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        # SUNTIKAN KHUSUS: Mengunci standar bahasa ke gnu89 & mematikan batasan ketat inline compiler modern
        export KCFLAGS="-std=gnu89 -Wno-error -Wno-inline -Wno-strict-prototypes -fno-inline-functions"
        export KCPPFLAGS="-Wno-error"

        # 1. Menyiapkan konfigurasi bawaan Redmi 12C (earth)
        make O=out earth_defconfig
        
        # 2. Mulai kompilasi utama dengan parameter penjinak compiler modern
        make -j$(nproc --all) O=out KCFLAGS="-std=gnu89 -Wno-error -Wno-inline -Wno-strict-prototypes -fno-inline-functions" KCPPFLAGS="-Wno-error"

    - name: Unggah Berkas Kernel Matang (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Redmi12C-Earth-LineageOS23.2
        path: |
          kernel/out/arch/arm64/boot/Image.gz-dtb
          kernel/out/arch/arm64/boot/Image
          kernel/out/arch/arm64/boot/dtbo.img
