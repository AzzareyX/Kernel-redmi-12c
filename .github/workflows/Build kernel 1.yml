name: Build Kernel Redmi 12C (Earth)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Membersihkan Ruang Penyimpanan Virtual Server
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
        sudo apt-get clean

    - name: Instalasi Kompiler & Dependensi Linux
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev xz-utils git GNUmake ccache clang lld llvm crossbuild-essential-arm64 crossbuild-essential-armhf libssl-dev tzdata libkmod-dev libelf-dev

    - name: Unduh Source Code Kernel (LineageOS Earth)
      run: |
        git clone https://github.com/LineageOS/android_kernel_xiaomi_earth.git --depth=1 -b lineage-23.2 kernel

    - name: Unduh Toolchain Kompiler Resmi (AOSP Clang)
      run: |
        # Mengunduh AOSP Clang versi stabil (r450784d) agar kompatibel dengan kompilasi kernel Android 15/16
        git clone https://googlesource.com --depth=1 -b master aosp-clang
        mkdir -p toolchain
        mv aosp-clang/clang-r450784d/* toolchain/
        rm -rf aosp-clang

    - name: Proses Kompilasi Kernel
      run: |
        cd kernel
        
        # Pengaturan Variabel Environment untuk Arsitektur dan Kompiler Clang (LLVM)
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
        
        # Mengarahkan kompilasi menggunakan LLVM Clang penuh (tanpa GCC bawaan lama)
        export CC=clang
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

        # 1. Menyiapkan konfigurasi bawaan Redmi 12C (earth)
        make O=out earth_defconfig
        
        # 2. Eksekusi Proses Penggabungan/Kompilasi
        make -j$(nproc --all) O=out

    - name: Unggah Berkas Kernel Matang (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Redmi12C-Earth-LineageOS23.2
        path: |
          kernel/out/arch/arm64/boot/Image.gz-dtb
          kernel/out/arch/arm64/boot/Image
          kernel/out/arch/arm64/boot/dtbo.img
