name: Merge CIP 4.19 (Redmi 12C / earth)

on:
  workflow_dispatch:
    inputs:
      cip_tag:
        description: "Tag CIP (mis. v4.19.325-cip136)"
        required: true
        default: "v4.19.325-cip136"
      build:
        description: "Build test setelah merge?"
        required: true
        default: true
        type: boolean
      push_branch:
        description: "Push hasil merge ke branch baru di fork ini? (butuh permissions write)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: merge-cip-earth
  cancel-in-progress: true

jobs:
  merge-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout lineage-23.2 (full history)
        uses: actions/checkout@v4
        with:
          ref: lineage-23.2
          fetch-depth: 0

      - name: Setup git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config commit.gpgsign false

      - name: Fetch CIP
        env:
          CIP_TAG: ${{ inputs.cip_tag }}
        run: |
          git remote add cip https://gitlab.com/cip-project/cip-kernel/linux-cip.git || true
          git fetch cip "refs/tags/${CIP_TAG}:refs/tags/${CIP_TAG}" --no-tags
          git log --oneline -1 "${CIP_TAG}"

      - name: Merge CIP
        env:
          CIP_TAG: ${{ inputs.cip_tag }}
        run: |
          set +e
          git merge --no-commit --no-ff "${CIP_TAG}"
          MERGE_RC=$?
          set -e

          git diff --name-only --diff-filter=U > conflicts.txt || true
          echo "=== Conflict files ==="
          cat conflicts.txt || true

          CIP_NUM=$(echo "${CIP_TAG}" | sed -E 's/.*-cip([0-9]+).*/\1/')
          ST_NUM=$((CIP_NUM - 116))   # cip124=st8, cip136=st20
          echo "CIP_NUM=${CIP_NUM} ST_NUM=${ST_NUM}" >> "$GITHUB_ENV"

          # Bump versi kernel (ini file yang memang dikelola manual di tree Android)
          printf -- "-cip%s\n" "${CIP_NUM}" > localversion-cip
          printf -- "-st%s\n"  "${ST_NUM}"  > localversion-st
          git add localversion-cip localversion-st
          rm -f conflicts.txt

          if [ -s conflicts.txt ]; then
            echo "::error::Merge berhenti: ada konflik di luar localversion-*. Lihat artifact conflicts.txt"
            exit 1
          fi

          git commit -m "Merge CIP ${CIP_TAG} into lineage-23.2 (earth)"
          git log --oneline -3
          cat localversion-cip localversion-st

      - name: Install build deps
        if: inputs.build
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu clang lld flex bison bc \
            libssl-dev libelf-dev cpio rsync python3

      - name: Build test (earth_defconfig, GCC aarch64)
        if: inputs.build
        run: |
          set -e
          make -j"$(nproc)" O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- earth_defconfig
          make -j"$(nproc)" O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- Image.gz dtbs
          ls -lh out/arch/arm64/boot/Image.gz
          cp out/.config kernel-config.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cip-merge-result-${{ github.run_number }}
          path: |
            conflicts.txt
            kernel-config.txt
            out/arch/arm64/boot/Image.gz
          if-no-files-found: warn

      - name: Push merge branch (opsional)
        if: inputs.push_branch
        run: |
          BRANCH="cip${CIP_NUM}-merge"
          git checkout -b "${BRANCH}"
          git push origin "${BRANCH}" --force-with-lease
          echo "Pushed branch: ${BRANCH}"
